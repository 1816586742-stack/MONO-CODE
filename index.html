<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONO GROW v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
:root{
  --bg:#fffaee; --card:#ffffff; --text:#000000; --sub:#555555;
  --red:#ff6b6b; --yellow:#ffd93d; --ok:#0a8a4a;
  --bd:#000000; --chip:#fff3d6;
  --sh:4px 4px 0 #000; --sh2:3px 3px 0 #000;
  --mono:'DM Mono',monospace;
  --sans:'Noto Sans SC',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100vh;display:flex;flex-direction:column;position:relative}
header{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;font-weight:900;color:#000;box-shadow:inset 0 -9px 0 var(--yellow);display:inline-block;line-height:1.1}
.lvl-pill{background:var(--yellow);border:2px solid var(--bd);border-radius:999px;
  padding:4px 12px;font-size:12px;color:#000;box-shadow:var(--sh2);font-family:var(--mono);font-weight:700}
main{flex:1;overflow-y:auto;padding:0 16px 90px}
.page{display:none}
.page.active{display:block}
#p-input.page.active{display:flex;flex-direction:column;justify-content:center;min-height:100%}
#p-input .card:first-child{margin-top:auto;margin-bottom:auto;max-width:480px;align-self:center;width:100%}
.card{background:var(--card);border:3px solid var(--bd);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{font-size:14px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:6px}
textarea{width:100%;border:2px solid var(--bd);padding:10px 12px;font-size:14px;font-family:var(--sans);
  background:#fff;color:var(--text);resize:vertical;outline:none;min-height:90px;transition:box-shadow .15s}
textarea:focus{box-shadow:var(--sh2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--bd);cursor:pointer;
  padding:12px 18px;font-size:14px;font-weight:900;font-family:var(--sans);transition:all .15s cubic-bezier(.34,1.56,.64,1)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.btn-primary{background:var(--red);color:#000;width:100%;margin-top:12px;box-shadow:var(--sh)}
.btn-primary:hover{box-shadow:6px 6px 0 #000;transform:translate(-2px,-2px)}
.btn-ghost{background:#fff;color:#000;font-size:13px;padding:8px 14px;border-width:2px;box-shadow:var(--sh2)}
.btn-danger{background:var(--yellow);color:#000;font-size:12px;padding:6px 12px;border-width:2px;box-shadow:var(--sh2)}
.hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
/* 示例灵感芯片 */
.eg-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.eg{font-size:12px;background:var(--chip);border:2px solid var(--bd);padding:5px 10px;cursor:pointer;
  font-family:var(--mono);box-shadow:var(--sh2);transition:all .15s}
.eg:hover{background:var(--yellow);transform:translate(-1px,-1px);box-shadow:3px 3px 0 #000}
/* 今日 */
.stage-tag{display:inline-block;font-size:11px;background:var(--yellow);border:2px solid var(--bd);
  color:#000;padding:2px 8px;margin-bottom:8px;font-family:var(--mono);font-weight:700;box-shadow:var(--sh2)}
.task{display:flex;gap:10px;padding:12px;border:2px solid var(--bd);margin-bottom:8px;background:#fff;
  transition:all .2s;position:relative;overflow:hidden}
.task:nth-of-type(odd){background:var(--chip)}
.task.done{background:#e8e8e8}
.task.done .t-title{text-decoration:line-through;color:#777}
.task input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin-top:2px;
  border:2px solid var(--bd);background:#fff;cursor:pointer;flex-shrink:0;position:relative}
.task input[type=checkbox]:checked{background:var(--red)}
.task input[type=checkbox]:checked::after{content:'✓';position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;color:#000;font-size:13px;font-weight:900}
.t-title{font-size:14px;font-weight:600;line-height:1.4}
.t-meta{font-size:12px;color:var(--sub);margin-top:4px;font-family:var(--mono)}
.t-verify{font-size:12px;color:var(--ok);margin-top:4px;font-weight:600}
.t-exp{margin-left:auto;flex-shrink:0;font-size:12px;font-weight:700;color:var(--red);align-self:center;font-family:var(--mono)}
.search-btn{opacity:.35;transition:opacity .2s;font-size:15px;align-self:center;padding:4px 6px;flex-shrink:0;text-decoration:none;line-height:1}
.search-btn:hover{opacity:.8}
/* 境界 */
.hero{text-align:center;padding:26px 16px;position:relative}
.avatar-wrap{position:relative;display:inline-block}
.hero .avatar{font-size:56px;animation:float 3s ease-in-out infinite;position:relative;z-index:1}
.avatar-ring{position:absolute;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;
  border:3px solid var(--yellow);border-radius:50%;z-index:0;animation:ringPulse 2.4s ease-out infinite;pointer-events:none}
@media (prefers-reduced-motion:reduce){.hero .avatar,.avatar-ring,.expbar>i,.expbar>i::after{animation:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ringPulse{0%{transform:scale(.75);opacity:.9}70%{transform:scale(1.15);opacity:0}100%{transform:scale(1.15);opacity:0}}
.hero .job{font-size:19px;font-weight:900;margin-top:8px;color:var(--red);-webkit-text-stroke:1px #000;letter-spacing:1px}
.hero .lv{font-size:13px;color:var(--sub);margin-top:4px;font-family:var(--mono)}
.expbar{height:16px;background:#fff;border:2px solid var(--bd);border-radius:999px;overflow:hidden;margin:16px 4px 6px;position:relative}
.expbar>i{display:block;height:100%;border-radius:999px;position:relative;overflow:hidden;
  background:repeating-linear-gradient(45deg,var(--red) 0 10px,var(--yellow) 10px 20px);
  background-size:28px 28px;animation:stripeFlow 1.2s linear infinite;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.expbar>i::after{content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);
  background-size:200% 100%;animation:sheen 2.2s ease-in-out infinite}
@keyframes stripeFlow{to{background-position:28px 0}}
@keyframes sheen{0%{background-position:200% 0}100%{background-position:-100% 0}}
.expnum{text-align:center;font-size:12px;color:var(--sub);font-family:var(--mono)}
.stat-row{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;background:#fff;border:2px solid var(--bd);padding:12px;text-align:center;box-shadow:var(--sh2)}
.stat b{display:block;font-size:22px;font-weight:900;color:var(--red);font-family:var(--mono)}
.stat span{font-size:11px;color:var(--sub)}
.jobpath .jp{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0;border-bottom:2px dashed var(--bd)}
.jobpath .jp:last-child{border:none}
.jp .dot{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--bd);flex-shrink:0}
.jp.cur .dot{background:var(--red);box-shadow:0 0 0 3px var(--yellow)}
.jp.cur b{color:var(--red)}
.jp.lock{opacity:.4}
/* 记忆 */
.mem{border:2px solid var(--bd);border-left:6px solid var(--red);padding:12px;background:#fff;margin-bottom:10px;box-shadow:var(--sh2)}
.mem .m-goal{font-size:14px;font-weight:700}
.mem .m-date{font-size:11px;color:var(--sub);margin:4px 0;font-family:var(--mono)}
.mem .m-note{font-size:13px;background:var(--chip);border:2px solid var(--bd);padding:8px 10px;margin-top:6px;line-height:1.6}
.mem .m-thought{font-size:13px;background:#e8f7ee;border:2px solid var(--bd);border-left:6px solid var(--ok);
  padding:8px 10px;margin-top:6px;line-height:1.6;font-weight:600}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 20px;line-height:2}
/* 记忆页顶部：即时复盘捕捉卡 */
.quick-cap{border:3px solid var(--bd);background:#fff;padding:18px;margin-bottom:14px;box-shadow:var(--sh);
  position:relative;overflow:hidden}
.quick-cap::before{content:'';position:absolute;inset:-3px;border-radius:inherit;
  background:conic-gradient(from 0deg,var(--red),var(--yellow),var(--ok),var(--red));
  z-index:-1;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask-composite:exclude;-webkit-mask-composite:xor;padding:3px;
  animation:capRotate 4s linear infinite;opacity:.25}
@media (prefers-reduced-motion:reduce){.quick-cap::before{animation:none;opacity:.12}}
.quick-cap.pulse::before{opacity:.55;animation-duration:2s}
@keyframes capRotate{to{transform:rotate(360deg)}}
.quick-cap h4{font-size:14px;font-weight:900;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.quick-cap h4 .dot-pulse{width:8px;height:8px;border-radius:50%;background:var(--red);
  animation:dotPulse 1.2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}
.quick-cap textarea{min-height:64px;margin-bottom:8px;
  transition:box-shadow .3s,border-color .3s}
.quick-cap textarea:focus{box-shadow:0 0 0 4px rgba(255,107,107,.18);border-color:var(--red)}
.cap-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* 语音按钮 */
.voice-btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--bd);background:#fff;
  padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--mono);
  box-shadow:var(--sh2);transition:all .15s;color:#000}
.voice-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.voice-btn.recording{background:var(--red);color:#fff;border-color:var(--red);
  animation:recPulse .8s ease-in-out infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.6)}50%{box-shadow:0 0 0 10px rgba(255,107,107,0)}}
.voice-btn .mic-dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.voice-btn.recording .mic-dot{background:#fff}
/* 记忆条目内联编辑 */
.mem .edit-inline{display:none;width:100%;margin-top:8px}
.mem .edit-inline.show{display:block}
.mem .edit-trigger{font-size:11px;color:var(--red);cursor:pointer;text-decoration:underline;font-family:var(--mono);
  display:inline-block;margin-top:6px}
.mem .edit-trigger:hover{color:#000}
.mem .m-note.editable{border-style:dashed;border-color:var(--red);background:#fff;
  cursor:pointer;transition:all .15s}
.mem .m-note.editable:hover{border-style:solid;background:var(--chip)}
/* 贡献热力图 */
.contrib-wrap{border:3px solid var(--bd);background:#fff;padding:16px 14px 12px;margin-bottom:14px;box-shadow:var(--sh);overflow:hidden}
.contrib-wrap h4{font-size:14px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.contrib-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;font-family:var(--mono)}
.streak-badge{background:var(--yellow);border:2px solid var(--bd);padding:2px 8px;font-weight:700;box-shadow:var(--sh2);
  white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.contrib-grid{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.contrib-col{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.contrib-cell{width:13px;height:13px;border-radius:2px;background:#f0f0f0;border:1px solid #e0e0e0;position:relative;
  transition:transform .12s;cursor:default}
.contrib-cell:hover{transform:scale(1.4);z-index:2;border-color:var(--bd)}
.contrib-cell.today{border-color:var(--bd);border-width:2px}
.contrib-label{font-size:9px;color:#bbb;text-align:center;min-width:13px;margin-top:2px;font-family:var(--mono)}
.contrib-legend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--sub);margin-top:8px;font-family:var(--mono)}
.contrib-legend span{width:13px;height:13px;border-radius:2px;flex-shrink:0}
.contrib-cell.has-mem{cursor:pointer;position:relative}
.contrib-cell.has-mem::after{content:'';position:absolute;bottom:1px;right:1px;width:4px;height:4px;border-radius:50%;background:var(--text);opacity:.5}
.mem-toast{position:absolute;z-index:20;pointer-events:none;opacity:0;
  background:#fff;border:3px solid var(--bd);box-shadow:var(--sh);padding:10px 12px;min-width:160px;max-width:240px}
.mem-toast-inner{font-size:12px;line-height:1.6}
.mt-item{padding:4px 0;font-family:var(--sans)}
.mt-item b{display:block;font-size:13px;color:var(--text);margin-bottom:2px}
.mt-item span{display:block;font-size:11px;color:var(--sub);line-height:1.4}
.mt-item+.mt-item{border-top:1px solid #eee;margin-top:2px;padding-top:6px}
.weekday-labels{display:flex;flex-direction:column;gap:3px;margin-right:4px;flex-shrink:0}
.weekday-labels span{width:13px;height:13px;font-size:8px;color:#ccc;text-align:center;line-height:13px;font-family:var(--mono)}
.contrib-scroll{display:flex;align-items:flex-start}
/* 导航 */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  background:#fff;border-top:3px solid var(--bd);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;border:none;background:none;cursor:pointer;font-size:11px;color:var(--sub);
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-family:var(--sans)}
nav button .ico{font-size:20px;padding:3px 6px;border:2px solid transparent;line-height:0}
nav button .ico svg{width:22px;height:22px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.active{color:#000;font-weight:900}
nav button.active .ico{background:var(--yellow);border-color:var(--bd)}
nav button.active .ico svg{stroke:#000}
/* 身份选择引导（首次进入） */
.onboard{position:fixed;inset:0;background:rgba(11,13,18,.92);z-index:80;display:none;
  align-items:center;justify-content:center;padding:20px}
.onboard.show{display:flex}
.onboard:not(.show){pointer-events:none;visibility:hidden}
.ob-box{width:100%;max-width:440px}
.ob-title{color:#fff;font-size:24px;font-weight:900;text-align:center;line-height:1.5}
.ob-sub{color:#8a91a3;font-size:13px;text-align:center;margin:10px 0 24px;line-height:1.8}
.id-card{display:flex;align-items:center;gap:14px;width:100%;background:#161a24;border:2px solid #262c3a;
  padding:16px 18px;margin-bottom:12px;cursor:pointer;color:#f2f4f8;text-align:left;
  font-family:var(--sans);transition:all .18s;opacity:0}
.id-card:hover{border-color:var(--yellow);transform:translateX(6px)}
.id-card .ic{font-size:26px}
.id-card .nm{font-size:16px;font-weight:900}
.id-card .ds{font-size:12px;color:#8a91a3;margin-top:2px}
.id-card .ar{margin-left:auto;color:#8a91a3}
/* 复盘弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal-mask.show{display:flex}
.modal{background:#fff;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border:3px solid var(--bd);border-bottom:none;
  box-shadow:6px 6px 0 #000;padding:20px;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:16px;font-weight:900;margin-bottom:10px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:99}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);max-width:calc(100vw-40px);background:#000;color:var(--yellow);
  border:2px solid var(--yellow);font-size:13px;font-weight:700;padding:10px 18px;
  opacity:0;transition:opacity .3s;z-index:100;pointer-events:none;font-family:var(--mono)}
.toast.show{opacity:.95}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="toast" id="toast" role="alert"></div>

<div id="app">
  <header>
    <h1>⚡ MONO CODE</h1>
    <div class="lvl-pill">Lv.<b id="hLv">1</b> <span id="hJob">初醒</span></div>
  </header>
  <main>
    <!-- 灵感 -->
    <section class="page active" id="p-input">
      <div class="card">
        <h3>💡 灵感输入</h3>
        <textarea id="goalInput" placeholder="写下一个真实目标，越具体越好。"></textarea>
        <button class="btn btn-primary" id="btnSplit" onclick="splitGoal()">⚡ 最小单元拆解</button>
        <div class="hint">方法论：目标 → 拆为最小可执行步骤 → 动手落地 → 复盘巩固 → 沉淀复利</div>
      </div>
    </section>

    <!-- 今日 -->
    <section class="page" id="p-today">
      <div id="energyBar"></div>
      <div id="todayBox"></div>
    </section>

    <!-- 记忆 -->
    <section class="page" id="p-mem">
      <div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="margin:0">🧠 记忆库 · 复利沉淀</h3>
        <div>
          <button class="btn btn-danger" onclick="exportData()" style="background:#fff;color:var(--sub);border-color:var(--sub);box-shadow:2px 2px 0 var(--sub);font-size:11px;padding:5px 10px">📤 导出</button>
          <button class="btn btn-danger" onclick="resetAll()" style="background:#fff;color:var(--red);border-color:var(--red);box-shadow:2px 2px 0 var(--red);font-size:11px;padding:5px 10px">🔄 重置</button>
        </div>
      </div>
      <!-- 贡献热力图 -->
      <div class="contrib-wrap" id="contribWrap"></div>
      <div id="memBox"></div>
    </section>
  </main>

  <nav>
    <button class="active" data-p="p-input" onclick="go(this)" aria-label="灵感页面"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="bulb-body" d="M12 4a5.5 5.5 0 0 0-3.4 9.8c.7.6 1 1.3 1 2.2h4.8c0-.9.3-1.6 1-2.2A5.5 5.5 0 0 0 12 4z"/>
      <path d="M9.5 19h5M10.5 21.5h3"/>
      <line class="ray" x1="12" y1="0.5" x2="12" y2="2.5"/>
      <line class="ray" x1="4.2" y1="3.4" x2="5.6" y2="4.8"/>
      <line class="ray" x1="19.8" y1="3.4" x2="18.4" y2="4.8"/>
      <line class="ray" x1="1" y1="9.5" x2="3" y2="9.5"/>
      <line class="ray" x1="23" y1="9.5" x2="21" y2="9.5"/>
    </svg></span>灵感</button>
    <button data-p="p-today" onclick="go(this)" aria-label="今日打卡"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3.5" y="3.5" width="17" height="17" rx="2"/>
      <polyline class="ck" points="7.5 12.5 10.5 15.5 16.5 8.5"/>
    </svg></span>To-Do</button>
    <button data-p="p-mem" onclick="go(this)" aria-label="记忆页面"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3 3 8l9 5 9-5-9-5z"/>
      <path d="M3 13l9 5 9-5"/>
      <path d="M3 17.5l9 5 9-5"/>
    </svg></span>记忆</button>
  </nav>
</div>

<!-- 复盘弹窗 -->
<div class="modal-mask" id="reviewMask" role="dialog" aria-modal="true" aria-label="复盘归档">
  <div class="modal">
    <h3>🎯 全部落地！复盘归档</h3>
    <div class="hint" style="margin:0 0 10px">复盘方法论：卡在哪？学到什么？下次怎么更快？感想将沉淀为你的「原思维」雏形。</div>
    <textarea id="reviewNote" placeholder="🛠 复盘：例：清灰时螺丝刀型号不对卡了10分钟，下次先核对工具清单"></textarea>
    <textarea id="reviewThought" style="margin-top:8px;min-height:70px" placeholder="💭 感想：做完这件事，你对自己有了什么新认识？（例：原来我真的可以独立拆机，手比想象中稳）"></textarea>
    <input id="reviewTags" style="width:100%;border:2px solid var(--bd);padding:8px 12px;font-size:13px;margin-top:8px;font-family:var(--mono)" placeholder="🏷 掌握了什么技能？（用逗号分隔，如：拆机、写代码、英语口语）">

<!-- 每日精力评估 -->
<div class="modal-mask" id="energyMask" role="dialog" aria-modal="true" aria-label="每日精力评估">
  <div class="modal" style="text-align:center">
    <div style="font-size:48px;margin-bottom:8px" id="energyEmoji">⚡</div>
    <h3>今日精力如何？</h3>
    <div class="hint" style="margin:8px 0 16px">选一个最接近的状态，帮你合理安排今天</div>
    <div id="energyOpts" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"></div>
  </div>
</div>

<script>
/* ============ 数据层 ============ */
const KEY='sourcevolve_v1';
let S=load();
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return d;}catch(e){}
  return {exp:0,doneTasks:0,goal:null,tasks:[],mem:[],identity:null,dailyActivity:{},energy:0,energyDate:''};
}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}

/* 每日活动追踪 */
function trackToday(){
  const today=new Date().toISOString().slice(0,10);
  S.dailyActivity[today]=(S.dailyActivity[today]||0)+1;
  save();
}
function streakDays(){
  let c=0,d=new Date();
  while(true){
    const k=d.toISOString().slice(0,10);
    if(S.dailyActivity[k]){c++;d.setDate(d.getDate()-1);}
    else break;
  }
  return c;
}

/* 境界体系：初醒→践行→修行→精进→宗师 */
const JOBS=[[1,'初醒','🌱'],[3,'践行者','🌿'],[5,'修行者','⚔️'],[8,'精进者','🔥'],[12,'宗师','👑']];
function level(){let l=1,e=S.exp;while(e>=expNeed(l)){e-=expNeed(l);l++;}return l;}
function expNeed(l){return 100+(l-1)*50;}
function expInLevel(){let l=1,e=S.exp;while(e>=expNeed(l)){e-=expNeed(l);l++;}return e;}
function job(){const l=level();let j=JOBS[0];for(const x of JOBS)if(l>=x[0])j=x;return j;}

/* ============ 每日精力变量系统（Spoon Theory + Eat The Frog） ============ */
const ENERGY_LEVELS=[
  {min:80,emoji:'🔋',label:'精力充沛',color:'#4A8F6E',bg:'#e8f7ee',mindset:'今天适合攻克最难的事——先吃掉那只青蛙！',strategy:'hardFirst'},
  {min:60,emoji:'⚡',label:'状态良好',color:'#6B9DFC',bg:'#e8f0fe',mindset:'按计划稳步推进，保持节奏就是胜利',strategy:'normal'},
  {min:40,emoji:'🔸',label:'精力一般',color:'#E8A838',bg:'#fef7e8',mindset:'聚焦最重要的1-2件事，其余随缘',strategy:'coreFirst'},
  {min:20,emoji:'🔹',label:'需要充电',color:'#D4956A',bg:'#fdf0e8',mindset:'只做简单的小行动，允许自己今天慢一点',strategy:'easyFirst'},
  {min:0,emoji:'🪫',label:'几乎耗尽',color:'#FF6B6B',bg:'#ffe8e8',mindset:'今天就做一件事，做完就好好夸自己',strategy:'minimal'},
];
function energyLevel(v){
  for(const l of ENERGY_LEVELS)if(v>=l.min)return l;
  return ENERGY_LEVELS[ENERGY_LEVELS.length-1];
}
function refreshEnergy(){
  const today=new Date().toISOString().slice(0,10);
  if(S.energyDate!==today){S.energy=0;S.energyDate=today;save();}
}
function showEnergyCheck(){
  const today=new Date().toISOString().slice(0,10);
  if(S.energyDate===today&&S.energy>0)return;
  const opts=[{v:100,emoji:'🔋',label:'充满电'},{v:75,emoji:'⚡',label:'还不错'},{v:50,emoji:'🔸',label:'一般般'},{v:25,emoji:'🔹',label:'有点累'},{v:10,emoji:'🪫',label:'需要休息'}];
  document.getElementById('energyOpts').innerHTML=opts.map(o=>
    '<button class="btn btn-ghost" style="flex-direction:column;padding:12px 16px;gap:4px;min-width:72px" onclick="setEnergy('+o.v+')"><span style="font-size:28px">'+o.emoji+'</span><span style="font-size:11px">'+o.label+'</span></button>'
  ).join('');
  document.getElementById('energyMask').classList.add('show');
}
function setEnergy(v){
  S.energy=v;S.energyDate=new Date().toISOString().slice(0,10);save();
  document.getElementById('energyMask').classList.remove('show');
  const lv=energyLevel(v);
  toast(lv.emoji+' '+lv.label+' · '+lv.mindset);
  renderToday();renderEnergyBar();
}
document.getElementById('energyMask').addEventListener('click',e=>{
  if(e.target.id==='energyMask')e.target.classList.remove('show');});

function renderEnergyBar(){
  const bar=document.getElementById('energyBar');
  refreshEnergy();
  if(!S.goal||!S.tasks.length){bar.innerHTML='';return;}
  const lv=energyLevel(S.energy||50);
  const pct=S.energy||50;
  bar.innerHTML='<div class="card" style="padding:10px 14px;margin-bottom:10px;background:'+lv.bg+'">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">'+
    '<span style="font-size:22px">'+lv.emoji+'</span>'+
    '<span style="font-weight:900;font-size:14px;color:'+lv.color+'">'+lv.label+' · '+pct+'%</span>'+
    '</div>'+
    '<div style="font-size:12px;color:var(--text);line-height:1.5">💡 '+lv.mindset+'</div>'+
    '<div style="height:5px;background:rgba(0,0,0,.1);border-radius:2px;margin-top:8px">'+
    '<div style="height:100%;width:'+pct+'%;background:'+lv.color+';border-radius:2px;transition:width .5s"></div></div></div>';
}

function getTaskWeight(minutes){return minutes<=10?1:minutes<=20?2:minutes<=30?3:4;}
function sortTasksByEnergy(){
  if(!S.tasks.length)return;
  const lv=energyLevel(S.energy||50);
  if(lv.strategy==='hardFirst')S.tasks.sort((a,b)=>getTaskWeight(b.minutes)-getTaskWeight(a.minutes));
  else if(lv.strategy==='easyFirst'||lv.strategy==='minimal')S.tasks.sort((a,b)=>getTaskWeight(a.minutes)-getTaskWeight(b.minutes));
  // coreFirst: keep original order (template order is good)
  // normal: keep original order
  save();renderToday();
}
/* ============ 精力系统结束 ============ */

/* ============ 导航 ============ */
function go(btn){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  // 物理按压反馈：按下 → 弹回（Active State 触感）
  if(G_OK&&!RM){
    gsap.killTweensOf(btn);
    gsap.fromTo(btn,{scale:1},{scale:.88,duration:.07,ease:'power2.in',
      onComplete:()=>gsap.to(btn,{scale:1,duration:.32,ease:'elastic.out(1,0.5)',clearProps:'transform'})});
  }
  animIcon(btn);
  const targetId=btn.dataset.p;
  const cur=document.querySelector('.page.active');
  const next=document.getElementById(targetId);
  if(cur===next){render();return;}
  if(window.gsap&&cur&&!RM){
    gsap.to(cur,{opacity:0,y:-14,duration:.2,ease:'power2.in',onComplete:()=>{
      cur.classList.remove('active');gsap.set(cur,{clearProps:'all'});
      next.classList.add('active');
      gsap.fromTo(next,{opacity:0,y:18},{opacity:1,y:0,duration:.32,ease:'power2.out',
        onComplete:()=>gsap.set(next,{clearProps:'all'})});
      render();playEnter(targetId);
    }});
  }else{
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    next.classList.add('active');render();playEnter(targetId);
  }
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);}

/* 导航图标动效：灯泡点亮发光 / 勾选划线 / 山峰跃起 / 层叠脉动 */
function animIcon(btn){
  if(!G_OK||RM)return;
  const svg=btn.querySelector('svg');if(!svg)return;
  const p=btn.dataset.p;
  if(p==='p-input'){
    // 思维被点亮：光线从灯泡四周散发（缩放展开+渐隐两连闪）
    const rays=svg.querySelectorAll('.ray');
    gsap.fromTo(rays,{opacity:0,scale:.2,transformOrigin:'12px 12px'},
      {opacity:1,scale:1.2,stagger:.05,duration:.22,ease:'power2.out',yoyo:true,repeat:1,repeatDelay:.12});
    const body=svg.querySelector('.bulb-body');
    gsap.fromTo(body,{fill:'rgba(255,217,61,.9)'},{fill:'rgba(255,217,61,0)',duration:.8,ease:'power2.out'});
  }else if(p==='p-today'){
    // 勾勾以描边动画划出来
    const ck=svg.querySelector('.ck');
    const len=ck.getTotalLength();
    gsap.fromTo(ck,{strokeDasharray:len,strokeDashoffset:len},
      {strokeDashoffset:0,duration:.45,ease:'power2.out'});
    gsap.fromTo(svg.querySelector('rect'),{scale:.9,transformOrigin:'12px 12px'},
      {scale:1,duration:.3,ease:'back.out(2)'});
  }else if(p==='p-mem'){
    // 记忆层叠：三层依次脉冲
    const layers=svg.querySelectorAll('path');
    gsap.fromTo(layers,{opacity:.3},{opacity:1,stagger:.1,duration:.25,ease:'power2.out'});
  }
}

/* ============ 智能模板拆解系统 v1.3 ============ */
const TEMPLATES={

    stages:[

        {title:'处理细节和收尾工作',verify:'主体完成，补充打磨',minutes:20},
        {title:'测试/验证是否达到预期效果',verify:'功能正常/效果符合预期',minutes:10}]},
      {name:'沉淀',tasks:[
        {title:'记录操作要点和踩坑经验',verify:'下次能做更快的关键点已记下',minutes:8}]}]},

    stages:[

      {name:'执行',tasks:[

        {title:'修改润色，精炼表达',verify:'删掉啰嗦的，强化核心的',minutes:20},
        {title:'最终检查，确认无误',verify:'从头完整过一遍，没有明显问题',minutes:10}]},
      {name:'沉淀',tasks:[
        {title:'记录创作心得和下次改进点',verify:'至少记下1个创作启示',minutes:8}]}]},

    stages:[
      {name:'准备',tasks:[
        {title:'明确今天要改变的一件事',verify:'具体到时间/地点/动作',minutes:3},
        {title:'移除可能的障碍',verify:'把阻碍你执行的东西先处理掉',minutes:5}]},
      {name:'执行',tasks:[
        {title:'立即执行最小版本的动作',verify:'哪怕只做5分钟也算完成',minutes:5},
        {title:'保持节奏，完成预定量',verify:'不被打断地完成计划',minutes:20}]},
      {name:'沉淀',tasks:[
        {title:'记录感受和明日继续的flag',verify:'今天的体验+明天的小承诺',minutes:5}]}]}
};
const TPL_ORDER=['general','study','build','create','life'];
const TPL_KW={
  study:['学','读','背','记','练','题','课','书','复习','预习','考试','英语','数学','编程'],
  build:['做','修','装','搭','清理','整理','部署','配置','安装','拆','改','硬件','设备'],
  create:['写','画','拍','录','创作','文章','视频','日记','设计','文案','脚本'],
  life:['跑','走','运动','健身','早起','作息','饮食','家务','收纳','购物','做饭']
};
function detectTpl(goal){
  const scores={general:1};
  for(const[k,ws] of Object.entries(TPL_KW))
    for(const w of ws)if(goal.includes(w))scores[k]=(scores[k]||0)+1;
  let best='general',max=1;
  for(const[k,v] of Object.entries(scores))if(v>max){max=v;best=k;}
  return best;
}
/* ============ 智能模板拆解（关键词自动匹配，前端不可见） ============ */
function splitGoal(){
  const goal=document.getElementById('goalInput').value.trim();
  if(!goal)return toast('先写一个目标');
  if(S.goal&&S.tasks.some(t=>!t.done)){
    if(!confirm('当前目标还有未完成的任务，拆解新目标会覆盖它们。确定继续？'))return;
  }
  const tplKey=S.template||detectTpl(goal);
  const tpl=TEMPLATES[tplKey]||TEMPLATES.general;
  S.template=tplKey;S.goal=goal;S.tasks=[];let id=0;
  for(const st of tpl.stages)for(const t of st.tasks)
    S.tasks.push({id:++id,stage:st.name,title:t.title.replace('{goal}',goal.slice(0,16)),verify:t.verify||'',minutes:t.minutes||15,done:false});
  save();sortTasksByEnergy();render();go(document.querySelectorAll('nav button')[1]);
  toast('✅ 已拆解为 '+S.tasks.length+' 个最小行动');
}
/* ============ 今日 ============ */
function renderToday(){
  const box=document.getElementById('todayBox');
  if(!S.goal||!S.tasks.length){
    box.innerHTML='<div class="empty">还没有行动目标<br>回到「灵感」输入一个目标并拆解 ⚡</div>';return Array.from(box.children);}
  const doneN=S.tasks.filter(t=>t.done).length;
  let h='<div class="card"><h3>🎯 '+esc(S.goal)+'</h3><div class="hint">'+doneN+' / '+S.tasks.length+' 已落地</div></div>';
  let lastStage='';
  for(const t of S.tasks){
    if(t.stage!==lastStage){h+='<div class="stage-tag">'+esc(t.stage)+'</div>';lastStage=t.stage;}
    h+='<label class="task'+(t.done?' done':'')+'">'
      +'<input type="checkbox" '+(t.done?'checked':'')+' onchange="checkTask('+t.id+',this)">'
      +'<div style="flex:1"><div class="t-title">'+esc(t.title)+'</div>'
      +'<div class="t-meta">⏱ 约'+t.minutes+'分钟</div>'
      +(t.verify?'<div class="t-verify">✓ 验证：'+esc(t.verify)+'</div>':'')
      +'</div>'
      +'<a href="https://www.google.com/search?q='+encodeURIComponent(t.title)+'" target="_blank" rel="noopener" class="search-btn" title="深度搜索：'+esc(t.title)+'" onclick="event.stopPropagation()" style="text-decoration:none;font-size:14px;align-self:center;padding:4px 6px;opacity:.5;flex-shrink:0">🔍</a>'
      +'<div class="t-exp">+'+taskExp(t)+'</div></label>';
  }
  if(doneN===S.tasks.length&&S.tasks.length>0)
    h+='<button class="btn btn-primary" onclick="openReview()">🎉 全部落地 · 复盘归档</button>';
  box.innerHTML=h;
  return Array.from(box.children);
}
function taskExp(t){return Math.max(10,Math.round(t.minutes));}
function checkTask(id,el){
  const t=S.tasks.find(x=>x.id===id);
  t.done=el.checked;
  if(t.done){
    S.exp+=taskExp(t);S.doneTasks++;
    trackToday();
    const r=el.getBoundingClientRect();
    burst(r.left+10,r.top+10);popTask(el);
    expFlyFx(r.left+10,r.top+10,'+'+taskExp(t)+' 修为');
    const l0=level();save();const streak=streakDays();
    if(level()>l0){setTimeout(()=>{burst(innerWidth/2,innerHeight/3,60);toast('🎉 境界提升！Lv.'+level()+' · '+job()[1]);},300);}
    else if([7,14,30,60,100].includes(streak)){
      setTimeout(()=>{burst(innerWidth/2,innerHeight/2,100);toast('🔥 连续 '+streak+' 天打卡！你正在持续进化');},400);
    }
  }else{S.exp-=taskExp(t);S.doneTasks--;}
  save();renderHeader();renderToday();
}
function openReview(){document.getElementById('reviewMask').classList.add('show');}
function archiveGoal(){
  const note=document.getElementById('reviewNote').value.trim();
  const thought=document.getElementById('reviewThought').value.trim();
  const tagsRaw=(document.getElementById('reviewTags')||{}).value||'';
  const tags=tagsRaw.trim()?tagsRaw.split(/[,，、\s]+/).filter(t=>t):[];
  S.mem.unshift({goal:S.goal,date:new Date().toLocaleString('zh-CN'),
    tasks:S.tasks.length,note:note||'（未写复盘）',thought:thought||'',tags});
  // 积累技能标签
  S.skillTags=S.skillTags||{};
  tags.forEach(t=>{const k=t.toLowerCase();S.skillTags[k]=(S.skillTags[k]||0)+1;});
  S.exp+=50;S.goal=null;S.tasks=[];
  trackToday();
  document.getElementById('reviewNote').value='';
  document.getElementById('reviewThought').value='';
  document.getElementById('reviewMask').classList.remove('show');
  save();burst(innerWidth/2,innerHeight/2,80);
  toast('📦 已归档 +50 修为');render();
}
document.getElementById('reviewMask').addEventListener('click',e=>{
  if(e.target.id==='reviewMask')e.target.classList.remove('show');});

function renderContrib(){
  const wrap=document.getElementById('contribWrap');
  const today=new Date().toISOString().slice(0,10);
  // 算最近 12 周（84 天）
  const end=new Date();end.setHours(23,59,59,999);
  const start=new Date(end);start.setDate(end.getDate()-83);
  start.setHours(0,0,0,0);
  const dow=start.getDay();const off=dow===0?6:dow-1;
  start.setDate(start.getDate()-off);

  // 构建日期→记忆索引
  const memIdx={};
  S.mem.forEach(m=>{
    try{
      const d=new Date(m.date);
      if(!isNaN(d.getTime())){
        const k=d.toISOString().slice(0,10);
        if(!memIdx[k])memIdx[k]=[];
        memIdx[k].push(m);
      }
    }catch(e){}
  });

  const weeks=[];
  let cur=new Date(start);
  while(cur<=end){
    const col=[];
    for(let d=0;d<7;d++){
      const ds=cur.toISOString().slice(0,10);
      const n=S.dailyActivity[ds]||0;
      const mems=memIdx[ds]||[];
      col.push({date:ds,count:n,isToday:ds===today,mems});
      cur.setDate(cur.getDate()+1);
    }
    weeks.push(col);
  }

  function cellColor(n){
    if(n===0)return'#f0f0f0';if(n===1)return'#fff3d6';
    if(n<=3)return'#ffd93d';if(n<=5)return'#ff9f43';return'#ff6b6b';
  }

  let h='<h4>🔥 行动足迹 <span style="font-size:12px;font-weight:400;color:var(--sub)">（悬停查看笔记）</span></h4>';
  h+='<div class="contrib-meta">';
  const sd=streakDays();const totalDays=Object.keys(S.dailyActivity).length;
  h+='<span class="streak-badge">🔥 连续 '+sd+' 天</span>';
  h+='<span style="color:var(--sub)">共 '+totalDays+' 个活跃日</span>';
  h+='<span style="color:var(--sub)">'+S.mem.length+' 条记忆</span>';
  h+='</div>';

  // 浮动记忆层
  h+='<div style="position:relative"><div class="contrib-scroll"><div class="weekday-labels">';
  const wdLabels=['一','','三','','五','','日'];
  wdLabels.forEach(l=>h+='<span>'+(l||'')+'</span>');
  h+='</div><div class="contrib-grid">';

  const months=[];
  weeks.forEach((col,i)=>{
    const firstDate=col[0].date;
    const mon=firstDate.slice(5,7);
    if(!months.length||months[months.length-1].mon!==mon)months.push({mon,idx:i});
  });
  h+='<div class="contrib-col" style="margin-right:2px">';
  for(let i=0;i<weeks.length;i++){
    const m=months.find(m=>m.idx===i);
    h+='<div class="contrib-label">'+(m?m.mon+'月':'')+'</div>';
  }
  h+='</div>';

  weeks.forEach(col=>{
    h+='<div class="contrib-col">';
    col.forEach(c=>{
      const hasMem=c.mems.length>0;
      h+='<div class="contrib-cell'+(c.isToday?' today':'')+(hasMem?' has-mem':'')+
        '" style="background:'+cellColor(c.count)+
        '" data-date="'+c.date+'" data-count="'+c.count+'" data-mems="'+esc(JSON.stringify(c.mems.map(m=>({goal:m.goal,note:m.note,thought:m.thought}))))+'"></div>';
    });
    h+='</div>';
  });
  h+='</div></div>';

  // 浮动笔记层
  h+='<div class="mem-toast" id="memToast"><div class="mem-toast-inner"></div></div></div>';

  h+='<div class="contrib-legend">少 ';
  [0,1,3,5,7].forEach(n=>h+='<span style="background:'+cellColor(n)+'"></span>');
  h+=' 多</div>';

  // 成长概览融合在热力图内
  const rl=level(),rj=job(),rc=expInLevel(),rn=expNeed(rl);
  const doneToday=Object.values(S.dailyActivity).slice(-1)[0]||0;
  h+='<div style="margin-top:12px;padding-top:10px;border-top:1px solid #eee;display:flex;gap:12px;flex-wrap:wrap">';
  h+='<div style="flex:1;min-width:70px;text-align:center;padding:6px;background:'+cellColor(S.doneTasks)+';border:1px solid var(--bd)"><div style="font-size:18px;font-weight:900;color:var(--text)">'+S.doneTasks+'</div><div style="font-size:9px;color:var(--sub);font-family:var(--mono)">落地行动</div></div>';
  h+='<div style="flex:1;min-width:70px;text-align:center;padding:6px;background:#fff3d6;border:1px solid var(--bd)"><div style="font-size:18px;font-weight:900;color:var(--text)">'+S.mem.length+'</div><div style="font-size:9px;color:var(--sub);font-family:var(--mono)">归档目标</div></div>';
  h+='<div style="flex:1;min-width:70px;text-align:center;padding:6px;background:#fff;border:1px solid var(--bd)"><div style="font-size:18px">'+rj[2]+'</div><div style="font-size:9px;color:var(--sub);font-family:var(--mono)">Lv.'+rl+' '+rj[1]+'</div></div>';
  h+='</div>';
  h+='<div style="margin-top:8px;font-size:10px;color:var(--sub);font-family:var(--mono);display:flex;gap:12px;flex-wrap:wrap">';
  h+='<span>⚡ '+S.exp+'总修为</span><span>🏃 今日'+doneToday+'次</span><span>🔥 连续'+streakDays()+'天</span>';
  h+='</div>';

  wrap.innerHTML=h;

  // 绑定悬停事件
  wrap.querySelectorAll('.contrib-cell').forEach(cell=>{
    const memsRaw=cell.dataset.mems;
    if(!memsRaw||memsRaw==='[]')return;
    const mems=JSON.parse(memsRaw);
    const toastEl=wrap.querySelector('#memToast');
    const inner=toastEl.querySelector('.mem-toast-inner');

    cell.addEventListener('mouseenter',()=>{
      const rect=cell.getBoundingClientRect();
      const wrapRect=wrap.getBoundingClientRect();
      let left=rect.left-wrapRect.left+12;
      let top=rect.top-wrapRect.top-8;
      // 防止溢出
      if(left+220>wrapRect.width)left=wrapRect.width-230;
      if(top+80>wrapRect.height)top=rect.top-wrapRect.top-100;

      inner.innerHTML=mems.map(m=>{
        const preview=m.note&&m.note!=='（未写复盘）'?m.note.slice(0,60):(m.thought?m.thought.slice(0,60):'');
        return '<div class="mt-item"><b>'+esc(m.goal.slice(0,14))+'</b>'+(preview?'<span>'+esc(preview)+(preview.length>=60?'...':'')+'</span>':'')+'</div>';
      }).join('');

      if(G_OK&&!RM){
        gsap.killTweensOf(toastEl);
        gsap.set(toastEl,{left,top});
        gsap.fromTo(toastEl,{opacity:0,scale:.9},{opacity:1,scale:1,duration:.2,ease:'power2.out'});
      }else{
        toastEl.style.left=left+'px';toastEl.style.top=top+'px';toastEl.style.opacity='1';
      }
    });

    cell.addEventListener('mouseleave',()=>{
      if(G_OK&&!RM){
        gsap.to(toastEl,{opacity:0,scale:.9,duration:.15,ease:'power2.in'});
      }else{toastEl.style.opacity='0';}
    });
  });

  // 自动滚动到本周
  setTimeout(()=>{const s=wrap.querySelector('.contrib-scroll');if(s)s.scrollLeft=s.scrollWidth;},50);
}

/* 日期记忆查询（供外部使用） */
function getDateMemories(isoDate){
  return S.mem.filter(m=>{
    try{const d=new Date(m.date);return !isNaN(d.getTime())&&d.toISOString().slice(0,10)===isoDate;}
    catch(e){return false;}
  });
}

function renderMem(){
  const box=document.getElementById('memBox');
  if(!S.mem.length){box.innerHTML='<div class="empty">记忆库还是空的<br>完成一个目标并复盘归档，开始复利 🧠</div>';return Array.from(box.children);}

  // 技能标签云
  let tagsHtml='';
  if(S.skillTags&&Object.keys(S.skillTags).length){
    const entries=Object.entries(S.skillTags).sort((a,b)=>b[1]-a[1]).slice(0,12);
    tagsHtml='<div class="card" style="margin-bottom:10px"><h3 style="margin-bottom:8px">🏷 已掌握的技能</h3><div style="display:flex;flex-wrap:wrap;gap:6px">';
    entries.forEach(([tag,n])=>{
      const size=n>5?14:n>3?13:12;
      const bg=n>5?'var(--yellow)':n>2?'var(--chip)':'#f5f5f5';
      tagsHtml+='<span style="font-size:'+size+'px;background:'+bg+';border:2px solid var(--bd);padding:2px 8px;font-family:var(--mono);box-shadow:var(--sh2)">'+esc(tag)+' ×'+n+'</span>';
    });
    tagsHtml+='</div></div>';
  }

  box.innerHTML=tagsHtml+S.mem.map((m,i)=>{
    const hasNote=m.note&&m.note!=='（未写复盘）';
    return '<div class="mem"><div class="m-goal">'+esc(m.goal)+'</div>'
      +'<div class="m-date">'+m.date+' · '+m.tasks+'个行动</div>'
      +(hasNote?'<div class="m-note">'+esc(m.note)+'</div>':'')
      +(m.thought?'<div class="m-thought">💭 '+esc(m.thought)+'</div>':'')
      +(m.tags&&m.tags.length?'<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">'+m.tags.map(t=>'<span style="font-size:10px;background:var(--chip);border:1px solid var(--bd);padding:1px 6px;font-family:var(--mono)">'+esc(t)+'</span>').join('')+'</div>':'')
      +'</div>';
  }).join('');
  return Array.from(box.children);
}
function resetAll(){
  if(!confirm('确定清空所有数据？修为、行动、记忆库都会丢失。'))return;
  localStorage.removeItem(KEY);S=load();render();toast('已重置');
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='eros-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  toast('📤 数据已导出');
}
/* ============ 粒子 ============ */
const cvs=document.getElementById('fx'),ctx=cvs.getContext('2d');let parts=[];
function resize(){cvs.width=innerWidth;cvs.height=innerHeight;}
addEventListener('resize',resize);resize();
function burst(x,y,n=24){
  const colors=['#ff6b6b','#ffd93d','#000000','#ffffff','#ff9f43'];
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8-3,
    life:1,c:colors[i%colors.length],r:Math.random()*4+2});
}
(function loop(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.life-=.02;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,7);ctx.fill();}
  ctx.globalAlpha=1;requestAnimationFrame(loop);
})();

/* ============ 渲染 ============ */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderHeader(){const j=job();
  document.getElementById('hLv').textContent=level();
  document.getElementById('hJob').textContent=j[1];}
function render(){renderHeader();renderEnergyBar();renderToday();renderContrib();renderMem();}

/* ============================================================
   GSAP 入场动效
   ============================================================ */
const G_OK=typeof window.gsap!=='undefined';
const MOBILE=matchMedia('(max-width:640px)').matches;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const D=MOBILE?0.75:1;
const EASE_MAIN='back.out(1.5)';
const EASE_SOFT='power3.out';

function countUp(el,to,dur=0.9){
  if(!G_OK||RM){el.textContent=to;return;}
  const o={v:0};
  gsap.to(o,{v:to,duration:dur*D,ease:'power2.out',onUpdate:()=>el.textContent=Math.round(o.v)});
}
function enterInput(){
  const tl=gsap.timeline({defaults:{ease:EASE_MAIN},
    onComplete:()=>gsap.set('#p-input .card, #p-input .card *, header h1, .lvl-pill',{clearProps:'all'})});
  tl.from('header h1',{y:-34,opacity:0,rotate:-4,duration:.55*D})
    .from('.lvl-pill',{scale:0,opacity:0,duration:.45*D,ease:'back.out(2.2)'},'-=.3')
    .from('#p-input > .card',{y:44,opacity:0,duration:.55*D,ease:EASE_SOFT},'-=.2')
    .from('#p-input > .card > *',{y:16,opacity:0,stagger:.06,duration:.35*D,ease:EASE_SOFT},'-=.3');
  const res=renderInputResult();
  if(res&&res.length)tl.from(res,{y:36,opacity:0,scale:.96,stagger:.1,duration:.5*D,ease:EASE_SOFT},'-=.15');
}
function enterToday(){
  const items=renderToday();
  if(!items||!items.length)return;
  gsap.from(items,{x:-40,opacity:0,scale:.97,stagger:.07,duration:.45*D,ease:EASE_MAIN,clearProps:'all'});
}
function enterMem(){
  const contribItems=renderContrib();
  const memItems=renderMem();

  // 热力图格子：从左到右逐个点亮（像 GitHub 图那种逐步激活感）
  if(G_OK&&!RM&&contribItems&&contribItems.length){
    const cells=document.querySelectorAll('.contrib-cell');
    if(cells.length){
      gsap.fromTo(cells,{opacity:0,scale:.3},
        {opacity:1,scale:1,stagger:{each:.012,from:'start'},duration:.25*D,ease:'back.out(1.8)',clearProps:'transform'});
    }
    // 连续打卡徽章弹入
    const badge=document.querySelector('.streak-badge');
    if(badge)gsap.from(badge,{scale:0,opacity:0,duration:.4*D,delay:.3,ease:'elastic.out(1,.5)'});
  }
  // 记忆条目卡片入场
  if(memItems&&memItems.length){
    const els=document.querySelectorAll('#memBox .mem');
    if(els.length){
      gsap.from(els,{x:44,opacity:0,rotate:1.5,stagger:.08,duration:.45*D,ease:EASE_MAIN,clearProps:'all'});
    }
  }
}
function playEnter(pageId){
  if(!G_OK||RM)return;
  switch(pageId){
    case 'p-input': enterInput(); break;
    case 'p-today': enterToday(); break;
    case 'p-mem': enterMem(); break;
  }
}
function popTask(el){
  if(!G_OK||RM)return;
  gsap.fromTo(el.closest('.task'),{scale:1},{scale:1.03,duration:.12,yoyo:true,repeat:1,ease:'power2.inOut',clearProps:'transform'});
}
function expFlyFx(x,y,txt){
  if(!G_OK||RM)return;
  const pill=document.querySelector('.lvl-pill');
  const pr=pill?pill.getBoundingClientRect():{left:innerWidth/2,top:20};
  const f=document.createElement('div');
  f.textContent=txt;
  f.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;z-index:120;pointer-events:none;'
    +'font-family:var(--mono);font-weight:700;font-size:13px;color:#000;'
    +'background:var(--yellow);border:2px solid #000;padding:2px 8px;box-shadow:2px 2px 0 #000';
  document.body.appendChild(f);
  gsap.timeline({onComplete:()=>f.remove()})
    .to(f,{y:-26,duration:.35,ease:'power2.out'})
    .to(f,{x:pr.left-x+pr.width/2,y:pr.top-y,scale:.6,duration:.55,ease:'power2.in'},'-=.05')
    .to(f,{opacity:0,duration:.15},'-=.1')
    .fromTo(pill,{scale:1},{scale:1.15,yoyo:true,repeat:1,duration:.15,ease:'power2.inOut'},'-=.3');
}

/* ============ 启动 ============ */
render();
refreshEnergy();
showEnergyCheck();         // 每日精力评估
if(G_OK&&!RM)enterInput();
// Enter 键拆解（Shift+Enter 换行）
document.getElementById('goalInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();splitGoal();}
});
