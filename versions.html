<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONO GROW · 版本演进</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    background: #FAF7F2;
    color: #2D2D2D;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 20px;
  }
  h1 { font-size: 2rem; margin-bottom: 8px; }
  .subtitle { color: #888; margin-bottom: 48px; font-size: 0.95rem; }
  .timeline { max-width: 600px; width: 100%; }
  .version {
    display: flex; align-items: flex-start; gap: 20px;
    padding: 24px;
    margin-bottom: 16px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    text-decoration: none; color: inherit;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 2px solid transparent;
  }
  .version:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    border-color: #D4956A;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    margin-top: 6px; flex-shrink: 0;
  }
  .v01 { background: #7C5CBF; } .v02 { background: #E8A838; }
  .v03 { background: #D4956A; } .v10 { background: #4A8F6E; }
  .info h3 { font-size: 1.1rem; margin-bottom: 4px; }
  .info p { font-size: 0.85rem; color: #666; line-height: 1.5; }
  .current { border-color: #4A8F6E; background: #f0faf5; }
  .badge {
    display: inline-block; font-size: 0.75rem;
    padding: 2px 8px; border-radius: 8px; margin-left: 8px;
  }
  .badge-latest { background: #4A8F6E; color: #fff; }
  .badge-coming { background: #f0f0f0; color: #999; }
  .gh-link {
    margin-top: 48px; font-size: 0.85rem; color: #888;
  }
  .gh-link a { color: #D4956A; text-decoration: none; }
</style>
</head>
<body>

<h1>MONO GROW</h1>
<p class="subtitle">从最小原型到完整系统的演进之路</p>

<div class="timeline">

  <a href="./v0.1/" class="version">
    <div class="dot v01"></div>
    <div class="info">
      <h3>v0.1 <span class="badge badge-coming">早期原型</span></h3>
      <p>紫色渐变主题 · AI 拆解 + 打卡 + EXP 升级 + 记忆库 · 最原始的概念验证</p>
    </div>
  </a>

  <a href="./v0.2/" class="version">
    <div class="dot v02"></div>
    <div class="info">
      <h3>v0.2 <span class="badge badge-coming">设计探索</span></h3>
      <p>Neubrutalism 风格换肤 · 奶油底+红黄撞色+粗黑边框+硬阴影 · 找到视觉语言</p>
    </div>
  </a>

  <a href="./v0.3/" class="version">
    <div class="dot v03"></div>
    <div class="info">
      <h3>v0.3 <span class="badge badge-coming">动效注入</span></h3>
      <p>GSAP 全面集成 · 入场/转场/经验条充能/头像弹跳/粒子特效 · 产品活起来了</p>
    </div>
  </a>

  <a href="./" class="version current">
    <div class="dot v10"></div>
    <div class="info">
      <h3>v1.0 <span class="badge badge-latest">最新</span></h3>
      <p>正式发布 · 灵感拆解/打卡系统/五阶境界/贡献热力图/语音复盘/记忆库 · 完整产品</p>
    </div>
  </a>

</div>

<p class="gh-link">
  <a href="https://github.com/1816586742-stack/MONO-CODE">GitHub →</a>
</p>

</body>
</html>
